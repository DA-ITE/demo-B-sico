let data=JSON.parse(localStorage.getItem('hv_demo_v1')||'null')||{tasks:seed,records:[],projects:[...new Map(seed.map(x=>[x.order,{client:x.client,order:x.order,project:x.project,type:x.type}])).values()]};let role='',page='dashboard',filter='all',recording=null,chunks=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('hv_demo_v1',JSON.stringify(data))}function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}function name(id){return clients.find(x=>x.id===id)?.name||id}function visible(){return data.tasks.filter(x=>clients.some(c=>c.id===role)?x.client===role:(filter==='all'||x.client===filter))}function login(){if($('password').value!=='HVdemo2026'){notify('Contraseña de demostración incorrecta');return}role=$('account').value;page=role==='operador'?'register':'dashboard';filter='all';$('login').classList.add('hide');$('app').classList.remove('hide');$('logout').style.display='';render()}function logout(){role='';$('login').classList.remove('hide');$('app').classList.add('hide');$('logout').style.display='none';$('password').value=''}function go(p){page=role==='operador'&&['dashboard','projects','manage','activities'].includes(p)?'register':p;render()}function nav(){const opts=role==='operador'?[]:[['dashboard','◫  Dashboard'],['projects','▤  Órdenes y proyectos']];if(['admin','supervisor','operador'].includes(role))opts.push(['register','✎  Registrar avances']);if(role==='admin')opts.push(['manage','⚙  Administrar proyectos']);if(['admin','supervisor'].includes(role))opts.push(['activities','☷  Gestionar actividades']);opts.push(['history','◷  Historial y evidencias']);$('nav').innerHTML='<p style="padding:0 12px;color:#b4d9eb">'+(clients.some(c=>c.id===role)?esc(name(role)):'HV · '+esc(role))+'</p>'+opts.map(([id,t])=>`<button class="${page===id?'active':' <i style="width:${v}%"></i></div><strong>${v}%</strong></div>`}).join('')}</div><div class="panel"><h2>Estado de ejecución</h2>${['Pendiente','En ejecución','En revisión','Completado','Bloqueado'].map(s=>{let n=a.filter(x=>x.status===s).length;return `<div class="bar"><span>${s}</span><div class="progress"><i style="width:${a.length?n/a.length*100:0}%"></i></div><strong>${n}</strong></div>`}).join('')}</div></div><div class="panel"><h2>Detalle de seguimiento</h2>${taskTable(a)}</div>`}

function manage(){if(role!=='admin')return go('dashboard');$('content').innerHTML=`<h1>Administración de proyectos</h1><p class="muted">Asigna órdenes y proyectos a cada cliente. El supervisor creará sus actividades.</p><div class="panel"><h2>Nueva orden / proyecto</h2><div class="formgrid"><div><label>Cliente</label><select id="mclient">${clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div><label>Orden de servicio</label><input id="morder" placeholder="OS-2026-004"></div><div><label>Nombre del proyecto</label><input id="mproject" placeholder="Mantenimiento preventivo"></div><div><label>Tipo de servicio</label><select id="mtype"><option>Mantenimiento</option><option>Servicios</option><option>Construcción</option><option>Instalación</option><option>Soporte técnico</option></select></div><div><label>Supervisor responsable</label><select><option>Supervisor HV · Demo</option></select></div><div style="align-self:end"><button onclick="addProject()">Crear proyecto</button></div></div></div><div class="panel"><h2>Proyectos asignados</h2>${data.projects.map(p=>`<div class="item"><b>${esc(p.order)} · ${esc(p.project)}</b><div class="small muted">${esc(name(p.client))} · ${esc(p.type)}</div></div>`).join('')}</div>`}
function addProject(){let client=$('mclient').value,order=$('morder').value.trim(),project=$('mproject').value.trim();if(!order||!project)return notify('Completa orden y proyecto');if(data.projects.some(x=>x.order===order&&x.client===client))return notify('La orden ya existe para este cliente');data.projects.push({client,order,project,type:$('mtype').value});save();notify('Proyecto creado');render()}
function activities(){if(!['admin','supervisor'].includes(role))return go('dashboard');$('content').innerHTML=`<h1>Gestión de actividades</h1><p class="muted">Define actividades y subactividades que el usuario operativo podrá actualizar.</p><div class="panel"><div class="formgrid"><div><label>Proyecto / orden</label><select id="aProject">${data.projects.map((p,i)=>`<option value="${i}">${esc(name(p.client))} · ${esc(p.order)} · ${esc(p.project)}</option>`).join('')}</select></div><div><label>Actividad</label><input id="aActivity" placeholder="Instalación de cámaras"></div><div><label>Subactividad</label><input id="aSub" placeholder="Tendido de cableado"></div><div><label>Responsable asignado</label><select id="aUser"><option value="operador">Usuario operativo HV · Demo</option></select></div><div><label>Estado inicial</label><select id="aStatus"><option>Pendiente</option><option>En ejecución</option></select></div><div style="align-self:end"><button onclick="addTask()">Agregar actividad</button></div></div></div><div class="panel">${taskTable(visible())}</div>`}
function addTask(){let p=data.projects[Number($('aProject').value)],activity=$('aActivity').value.trim(),sub=$('aSub').value.trim();if(!activity||!sub)return notify('Completa actividad y subactividad');data.tasks.push({id:Date.now(),...p,activity,sub,assigned:$('aUser').value,status:$('aStatus').value,progress:0,detail:'',date:new Date().toISOString().slice(0,10)});save();notify('Actividad asignada');render()}
function register(){if(!['admin','supervisor','operador'].includes(role))return go('dashboard');$('content').innerHTML=`<h1>Registro de avances</h1><p class="muted">Selecciona la ruta de trabajo y documenta la ejecución de campo.</p><div class="panel"><div class="formgrid"><div><label>1. Cliente</label><select id="rClient" onchange="cascade('client')"><option value="">Seleccionar</option>${clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div><label>2. Orden de servicio</label><select id="rOrder" onchange="cascade('order')"></select></div><div><label>3. Proyecto</label><select id="rProject" onchange="cascade('project')"></select></div><div><label>4. Actividad</label><select id="rActivity" onchange="cascade('activity')"></select></div><div><label>5. Subactividad</label><select id="rSub" onchange="loadTask()"></select></div><div><label>Tipo de intervención</label><select id="rType"><option>Servicio técnico</option><option>Mantenimiento preventivo</option><option>Mantenimiento correctivo</option><option>Instalación</option><option>Construcción / obra civil</option><option>Inspección</option></select></div><div><label>Estado de ejecución</label><select id="rStatus"><option>Pendiente</option><option>En ejecución</option><option>En revisión</option><option>Completado</option><option>Bloqueado</option></select></div><div><label>Porcentaje de avance (0–100)</label><input id="rProgress" type="number" min="0" max="100" value="0"></div><div><label>Fecha del trabajo</label><input id="rDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Ubicación / área de intervención</label><input id="rArea" placeholder="Planta / sala / zona"></div><div><label>Incidencia o riesgo</label><select id="rRisk"><option>Sin incidencias</option><option>Falta de materiales</option><option>Acceso restringido</option><option>Riesgo de seguridad</option><option>Falla técnica</option><option>Otro</option></select></div><div><label>Próxima function fill(id,vals,placeholder){$(id).innerHTML=`<option value="">${placeholder}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}

function selectedTask(){return data.tasks.find(x=>x.client===$('rClient').value&&x.order===$('rOrder').value&&x.project===$('rProject').value&&x.activity===$('rActivity').value&&x.sub===$('rSub').value)}function loadTask(){let t=selectedTask();if(t){$('rStatus').value=t.status;$('rProgress').value=t.progress;$('rDetail').value=t.detail||''}}let voiceRecognition=null,voiceFinal='',voiceInterim='',voiceRecording=false;
function updateTranscript(){let el=$('rTranscript');if(el)el.value=[voiceFinal,voiceInterim].filter(Boolean).join(' ').trim()}
async function startAudio(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return notify('La grabación requiere un navegador compatible y HTTPS o localhost');try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recording=new MediaRecorder(stream);voiceFinal=$('rTranscript')?.value.trim()||'';voiceInterim='';voiceRecording=true;recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recording.onstop=()=>{let blob=new Blob(chunks,{type:recording.mimeType});$('audioInfo').textContent='Audio grabado ('+Math.round(blob.size/1024)+' KB). Disponible en esta sesión.';let url=URL.createObjectURL(blob);let player=document.createElement('audio');player.controls=true;player.src=url;$('audioInfo').append(' ',player);stream.getTracks().forEach(t=>t.stop())};recording.start();$('recStart').disabled=true;$('recStop').disabled=false;$('audioInfo').textContent='Grabando...';let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){try{voiceRecognition=new SR();voiceRecognition.lang='es-PE';voiceRecognition.continuous=true;voiceRecognition.interimResults=true;voiceRecognition.onresult=e=>{voiceInterim='';for(let i=e.resultIndex;i<e.results.length;i++){let phrase=e.results[i][0].transcript;if(e.results[i].isFinal)voiceFinal+=(voiceFinal?' ':'')+phrase.trim();else voiceInterim+=' '+phrase.trim()}updateTranscript()};voiceRecognition.onerror=e=>{$('transcriptInfo').textContent='Transcripción automática no disponible ('+e.error+'). Puedes escribirla manualmente.'};voiceRecognition.onend=()=>{if(voiceRecording){try{voiceRecognition.start()}catch(e){}}};voiceRecognition.start();$('transcriptInfo').textContent='Transcribiendo en español mientras grabas. Revisa y corrige el texto antes de guardar.'}catch(e){$('transcriptInfo').textContent='No se pudo iniciar la transcripción automática; puedes escribirla manualmente.'}}else{$('transcriptInfo').textContent='Este navegador no admite transcripción automática. Puedes escribir la transcripción manualmente.'}}catch(e){notify('No se pudo acceder al micrófono')}}
function stopAudio(){voiceRecording=false;if(voiceRecognition){try{voiceRecognition.stop()}catch(e){}}if(recording?.state==='recording')recording.stop();$('recStart').disabled=false;$('recStop').disabled=true}
function submitRecord(){let t=selectedTask();if(!t)return notify('Selecciona cliente, orden, proyecto, actividad y subactividad');let progress=Number($('rProgress').value),status=$('rStatus').value;if(!Number.isFinite(progress)||progress<0||progress>100)return notify('El avance debe estar entre 0 y 100');if(status==='Completado'&&progress!==100)return notify('Para completar, el avance debe ser 100%');if(!$('rDetail').value.trim())return notify('Describe el trabajo realizado');let files=[...$('rFiles').files].map(f=>({name:f.name,size:f.size}));let rec={id:Date.now(),taskId:t.id,client:t.client,order:t.order,project:t.project,activity:t.activity,sub:t.sub,by:role,status,progress,detail:$('rDetail').value.trim(),date:$('rDate').value,area:$('rArea').value,risk:$('rRisk').value,next:$('rNext').value,files,audioRecorded:chunks.length>0,transcript:$('rTranscript').value.trim()};t.status=status;t.progress=progress;t.detail=rec.detail;t.date=rec.date;data.records.unshift(rec);save();notify('Avance registrado correctamente');go('history')}
function history(){let allowed=data.records.filter(x=>clients.some(c=>c.id===role)?x.client===role:filter==='all'||x.client===filter);$('content').innerHTML=`<h1>Historial de registros</h1><p class="muted">Bitácora de avances ingresados durante la demo.</p><div class="panel">${allowed.length?allowed.map(r=>`<div class="item"><div class="row"><b>${esc(name(r.client))} · ${esc(r.order)}</b><span class="pill">${esc(r.status)} · ${r.progress}%</span></div><div class="small muted">${esc(r.date)} · ${esc(r.by)} · ${esc(r.project)}</div><p><b>${esc(r.activity)} / ${esc(r.sub)}</b></p><p>${esc(r.detail)}</p>${r.transcript?`<p><b>Transcripción de audio:</b> ${esc(r.transcript)}</p>`:""}<div class="small muted">Área: ${esc(r.area||'No indicada')} · Incidencia: ${esc(r.risk)} · Próxima acción: ${esc(r.next||'No indicada')}</div><div class="file">${r.files.map(f=>'📎 '+esc(f.name)+' ('+Math.round(f.size/1024)+' KB)').join(' · ')} ${r.audioRecorded?'🎤 Audio registrado (no almacenado)':''}</div></div>`).join(''):'Aún no hay registros nuevos. Puedes crear uno en Registro de avances.'}</div>`}
</script></body></html>
